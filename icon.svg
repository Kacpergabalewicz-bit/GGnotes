<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8a5cff" />
      <stop offset="55%" stop-color="#5b3df0" />
      <stop offset="100%" stop-color="#3a1fc9" />
    </linearGradient>
    <linearGradient id="pen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd60a" />
      <stop offset="100%" stop-color="#ff9f0a" />
    </linearGradient>
  </defs>

  <rect width="120" height="120" rx="26" fill="url(#bg)" />

  <!-- Kartka notatnika (lekko obrócona) -->
  <g transform="rotate(-6 60 62)">
    <rect x="26" y="20" width="68" height="84" rx="8" fill="#ffffff" />
    <line x1="38" y1="38" x2="82" y2="38" stroke="#d8d0ff" stroke-width="6" stroke-linecap="round" />
    <line x1="38" y1="52" x2="82" y2="52" stroke="#e7e2ff" stroke-width="6" stroke-linecap="round" />
    <line x1="38" y1="66" x2="70" y2="66" stroke="#e7e2ff" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Długopis piszący po kartce -->
  <g transform="rotate(45 78 46)">
    <rect x="72" y="10" width="14" height="62" rx="7" fill="url(#pen)" />
    <rect x="72" y="10" width="14" height="16" rx="7" fill="#3a1fc9" />
    <path d="M72 72 L79 90 L86 72 Z" fill="#3a1fc9" />
  </g>
</svg>
