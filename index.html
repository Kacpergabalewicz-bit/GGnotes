<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>GG Notes</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0b5cff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GG Notes" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <!-- LISTA NOTATEK -->
    <section id="listScreen" class="screen">
      <header class="topbar">
        <h1>GG Notes</h1>
        <div class="topbar-actions">
          <button id="themeBtn" class="icon-btn" title="Motyw" aria-label="Przełącz motyw">🌙</button>
          <button id="menuBtn" class="dots-btn" title="Menu" aria-label="Menu" aria-haspopup="true">
            <span></span><span></span><span></span>
          </button>
        </div>

        <div id="menuDropdown" class="dropdown" role="menu">
          <div class="menu-options">
            <button id="searchMenuBtn" class="menu-option" type="button">
              <span class="option-icon icon-search">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
              </span>
              <span class="option-label">Wyszukaj</span>
            </button>
            <button id="voiceMenuBtn" class="menu-option" type="button">
              <span class="option-icon icon-mic">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
              </span>
              <span class="option-label">Nagraj notatkę</span>
            </button>
            <button id="favMenuBtn" class="menu-option" type="button">
              <span class="option-icon icon-fav">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="#fff" stroke="#fff" stroke-width="1"><polygon points="12 2 15.09 8.63 22 9.27 16.5 14.14 18.18 21 12 17.27 5.82 21 7.5 14.14 2 9.27 8.91 8.63"></polygon></svg>
              </span>
              <span class="option-label">Ulubione</span>
            </button>
            <button id="folderMenuBtn" class="menu-option" type="button">
              <span class="option-icon icon-folder">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
              </span>
              <span class="option-label">Foldery</span>
            </button>
            <button id="drawMenuBtn" class="menu-option" type="button">
              <span class="option-icon icon-draw">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"></path><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path><path d="M2 2l7.586 7.586"></path><circle cx="11" cy="11" r="2"></circle></svg>
              </span>
              <span class="option-label">Rysuj</span>
            </button>
          </div>
          <div class="menu-secondary">
            <button id="exportBtn" type="button">Eksportuj notatki</button>
            <button id="importBtn" type="button">Importuj notatki</button>
            <input id="importFile" type="file" accept="application/json" hidden />
            <button id="shareAppBtn" type="button">Udostępnij aplikację</button>
            <button id="pinSettingsBtn" type="button">Ustaw PIN / Face ID</button>
            <span id="backupInfo" class="backup-info"></span>
          </div>
        </div>
      </header>

      <div class="searchbar" id="favBar">
        <span class="fav-bar-label">⭐ Ulubione notatki</span>
        <button id="closeFavBtn" class="icon-btn" aria-label="Zamknij ulubione">✕</button>
      </div>

      <div class="searchbar" id="searchBar">
        <input id="search" placeholder="Szukaj notatek..." />
        <button id="closeSearchBtn" class="icon-btn" aria-label="Zamknij wyszukiwanie">✕</button>
      </div>

      <div id="listPane"></div>
      <button id="newBtn" class="fab" aria-label="Nowa notatka">+</button>

      <div id="sheetBackdrop" class="backdrop hidden"></div>
    </section>

    <!-- EDYTOR NOTATKI -->
    <section id="editorScreen" class="screen">
      <header class="topbar">
        <button id="backBtn" class="icon-btn" aria-label="Wróć">←</button>
        <input id="noteTitle" placeholder="Tytuł" />
        <button id="shareBtn" class="icon-btn" title="Udostępnij" aria-label="Udostępnij notatkę">📤</button>
        <button id="lockBtn" class="icon-btn" title="Zablokuj PIN-em" aria-label="Zablokuj notatkę">🔓</button>
        <button id="pinBtn" class="icon-btn" title="Przypnij" aria-label="Przypnij">☆</button>
      </header>
      <div id="noteBody" class="note-body-editable" contenteditable="true" data-placeholder="Twoja notatka..."></div>

      <div id="audioPlayerWrap" class="audio-wrap hidden">
        <audio id="audioPlayer" controls></audio>
        <button id="deleteAudioBtn" class="icon-btn" aria-label="Usuń nagranie">🗑</button>
      </div>

      <div class="editor-actions">
        <button id="recordBtn" class="icon-btn record-btn" aria-label="Nagraj notatkę głosową">🎤</button>
        <button id="photoBtn" class="icon-btn" aria-label="Dodaj zdjęcie">📷</button>
        <input id="photoFile" type="file" accept="image/*" multiple hidden />
        <button id="drawAttachBtn" class="icon-btn" aria-label="Dodaj rysunek">✏️</button>
        <span id="recordStatus" class="record-status"></span>
        <div class="spacer"></div>
        <button id="deleteBtn" class="danger">Usuń</button>
        <button id="saveBtn">Zapisz</button>
      </div>
    </section>

    <!-- LISTA FOLDERÓW -->
    <section id="foldersScreen" class="screen">
      <header class="topbar">
        <button id="foldersBackBtn" class="icon-btn" aria-label="Wróć">←</button>
        <h1 class="screen-title">Foldery</h1>
      </header>
      <div id="foldersPane" class="list-pane"></div>
      <button id="newFolderBtn" class="fab" aria-label="Nowy folder">+</button>
    </section>

    <!-- SZCZEGÓŁY FOLDERU -->
    <section id="folderDetailScreen" class="screen">
      <header class="topbar">
        <button id="folderBackBtn" class="icon-btn" aria-label="Wróć">←</button>
        <h1 id="folderDetailTitle" class="screen-title">Folder</h1>
        <button id="folderAddNoteBtn" class="circle-btn" title="Dodaj nową notatkę do folderu" aria-label="Dodaj nową notatkę do folderu">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
        <button id="folderSearchAddBtn" class="circle-btn" title="Dodaj istniejące notatki" aria-label="Dodaj istniejące notatki">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </button>
      </header>
      <div id="folderNotesPane" class="list-pane"></div>
    </section>

    <!-- WYBÓR NOTATEK DO DODANIA -->
    <section id="folderPickerScreen" class="screen">
      <header class="topbar">
        <button id="pickerCloseBtn" class="icon-btn" aria-label="Zamknij">✕</button>
        <input id="pickerSearch" class="picker-search" placeholder="Szukaj notatek..." />
        <button id="pickerAddBtn" class="pill-add-btn" type="button">Dodaj</button>
      </header>
      <div id="pickerNotesPane" class="list-pane"></div>
    </section>

    <!-- RYSOWANIE ODRĘCZNE -->
    <section id="drawScreen" class="screen">
      <header class="topbar">
        <button id="drawCloseBtn" class="icon-btn" aria-label="Zamknij">✕</button>
        <h1 class="screen-title">Rysunek</h1>
        <button id="drawUndoBtn" class="icon-btn" title="Cofnij" aria-label="Cofnij">↩︎</button>
        <button id="drawClearBtn" class="icon-btn" title="Wyczyść" aria-label="Wyczyść">🗑</button>
        <button id="drawSaveBtn" class="circle-btn" title="Zapisz" aria-label="Zapisz rysunek">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </button>
      </header>
      <div class="draw-canvas-wrap">
        <canvas id="drawCanvas"></canvas>
      </div>
      <div class="draw-toolbar">
        <div id="drawColors" class="draw-colors">
          <button class="draw-color active" type="button" data-color="#1c1c1e" style="background:#1c1c1e"></button>
          <button class="draw-color" type="button" data-color="#ff3b30" style="background:#ff3b30"></button>
          <button class="draw-color" type="button" data-color="#0b5cff" style="background:#0b5cff"></button>
          <button class="draw-color" type="button" data-color="#34c759" style="background:#34c759"></button>
          <button class="draw-color" type="button" data-color="#ffcc00" style="background:#ffcc00"></button>
          <button class="draw-color" type="button" data-color="#ffffff" style="background:#ffffff"></button>
        </div>
        <div id="drawSizes" class="draw-sizes">
          <button class="draw-size active" type="button" data-size="3"><span style="width:5px;height:5px"></span></button>
          <button class="draw-size" type="button" data-size="7"><span style="width:9px;height:9px"></span></button>
          <button class="draw-size" type="button" data-size="14"><span style="width:15px;height:15px"></span></button>
        </div>
      </div>
    </section>

    <!-- MODAL: NOWY FOLDER -->
    <div id="folderModalBackdrop" class="backdrop hidden"></div>
    <div id="folderModal" class="folder-modal">
      <h3>Nowy folder</h3>
      <input id="folderNameInput" class="modal-input" placeholder="Nazwa folderu" />
      <div class="modal-actions">
        <button id="folderCancelBtn" class="btn-secondary" type="button">Anuluj</button>
        <button id="folderCreateBtn" type="button">Utwórz</button>
      </div>
    </div>

    <!-- MODAL: PIN / FACE ID -->
    <div id="pinModalBackdrop" class="backdrop hidden"></div>
    <div id="pinModal" class="folder-modal pin-modal">
      <h3 id="pinTitle">Wprowadź PIN</h3>
      <p id="pinSubtitle" class="pin-subtitle hidden">Notatka jest zablokowana</p>
      <input id="pinInput" class="modal-input" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="PIN (4-6 cyfr)" />
      <div id="pinConfirmWrap" class="hidden">
        <input id="pinConfirmInput" class="modal-input" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="Powtórz PIN" />
      </div>
      <div id="pinError" class="pin-error hidden"></div>
      <button id="pinBiometricBtn" class="btn-secondary pin-bio-btn hidden" type="button">🔐 Użyj Face ID / Touch ID</button>
      <button id="pinRegisterBioBtn" class="btn-secondary pin-bio-btn hidden" type="button">👤 Zarejestruj Face ID / Touch ID</button>
      <div class="modal-actions">
        <button id="pinCancelBtn" class="btn-secondary" type="button">Anuluj</button>
        <button id="pinSubmitBtn" type="button">Zatwierdź</button>
      </div>
    </div>

    <!-- PODGLĄD ZDJĘCIA -->
    <div id="photoViewer" class="photo-viewer hidden">
      <button id="photoViewerCloseBtn" class="icon-btn photo-viewer-close" aria-label="Zamknij">✕</button>
      <img id="photoViewerImg" src="" alt="Zdjęcie" />
    </div>

    <!-- PASEK PRZECIĄGANIA DO FOLDERU -->
    <div id="dropFoldersBar" class="drop-folders-bar hidden">
      <div class="drop-folders-label">Upuść na folder, aby dodać</div>
      <div id="dropFoldersChips" class="drop-folders-chips"></div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="toast hidden"></div>
  </div>

  <script type="module" src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/service-worker.js');
    }
  </script>
</body>
</html>
