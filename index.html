<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>GG Notes</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0b5cff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GG Notes" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <!-- LISTA NOTATEK -->
    <section id="listScreen" class="screen">
      <header class="topbar">
        <h1>GG Notes</h1>
        <div class="topbar-actions">
          <button id="themeBtn" class="icon-btn" title="Motyw" aria-label="Przełącz motyw">🌙</button>
          <button id="menuBtn" class="dots-btn" title="Menu" aria-label="Menu" aria-haspopup="true">
            <span></span><span></span><span></span>
          </button>
        </div>

        <div id="menuDropdown" class="dropdown" role="menu">
          <div class="menu-options">
            <button id="searchMenuBtn" class="menu-option" type="button">
              <span class="option-icon icon-search">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
              </span>
              <span class="option-label">Wyszukaj</span>
            </button>
            <button id="voiceMenuBtn" class="menu-option" type="button">
              <span class="option-icon icon-mic">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
              </span>
              <span class="option-label">Nagraj notatkę</span>
            </button>
            <button id="favMenuBtn" class="menu-option" type="button">
              <span class="option-icon icon-fav">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="#fff" stroke="#fff" stroke-width="1"><polygon points="12 2 15.09 8.63 22 9.27 16.5 14.14 18.18 21 12 17.27 5.82 21 7.5 14.14 2 9.27 8.91 8.63"></polygon></svg>
              </span>
              <span class="option-label">Ulubione</span>
            </button>
            <button id="folderMenuBtn" class="menu-option" type="button">
              <span class="option-icon icon-folder">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
              </span>
              <span class="option-label">Foldery</span>
            </button>
          </div>
          <div class="menu-secondary">
            <button id="exportBtn" type="button">Eksportuj notatki</button>
            <button id="importBtn" type="button">Importuj notatki</button>
            <input id="importFile" type="file" accept="application/json" hidden />
          </div>
        </div>
      </header>

      <div class="searchbar" id="favBar">
        <span class="fav-bar-label">⭐ Ulubione notatki</span>
        <button id="closeFavBtn" class="icon-btn" aria-label="Zamknij ulubione">✕</button>
      </div>

      <div class="searchbar" id="searchBar">
        <input id="search" placeholder="Szukaj notatek..." />
        <button id="closeSearchBtn" class="icon-btn" aria-label="Zamknij wyszukiwanie">✕</button>
      </div>

      <div id="listPane"></div>
      <button id="newBtn" class="fab" aria-label="Nowa notatka">+</button>

      <div id="sheetBackdrop" class="backdrop hidden"></div>
    </section>

    <!-- EDYTOR NOTATKI -->
    <section id="editorScreen" class="screen">
      <header class="topbar">
        <button id="backBtn" class="icon-btn" aria-label="Wróć">←</button>
        <input id="noteTitle" placeholder="Tytuł" />
        <button id="pinBtn" class="icon-btn" title="Przypnij" aria-label="Przypnij">☆</button>
      </header>
      <textarea id="noteBody" placeholder="Twoja notatka..."></textarea>

      <div id="audioPlayerWrap" class="audio-wrap hidden">
        <audio id="audioPlayer" controls></audio>
        <button id="deleteAudioBtn" class="icon-btn" aria-label="Usuń nagranie">🗑</button>
      </div>

      <div class="editor-actions">
        <button id="recordBtn" class="icon-btn record-btn" aria-label="Nagraj notatkę głosową">🎤</button>
        <span id="recordStatus" class="record-status"></span>
        <div class="spacer"></div>
        <button id="deleteBtn" class="danger">Usuń</button>
        <button id="saveBtn">Zapisz</button>
      </div>
    </section>

    <!-- LISTA FOLDERÓW -->
    <section id="foldersScreen" class="screen">
      <header class="topbar">
        <button id="foldersBackBtn" class="icon-btn" aria-label="Wróć">←</button>
        <h1 class="screen-title">Foldery</h1>
      </header>
      <div id="foldersPane" class="list-pane"></div>
      <button id="newFolderBtn" class="fab" aria-label="Nowy folder">+</button>
    </section>

    <!-- SZCZEGÓŁY FOLDERU -->
    <section id="folderDetailScreen" class="screen">
      <header class="topbar">
        <button id="folderBackBtn" class="icon-btn" aria-label="Wróć">←</button>
        <h1 id="folderDetailTitle" class="screen-title">Folder</h1>
        <button id="folderAddNoteBtn" class="circle-btn" title="Dodaj nową notatkę do folderu" aria-label="Dodaj nową notatkę do folderu">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
        <button id="folderSearchAddBtn" class="circle-btn" title="Dodaj istniejące notatki" aria-label="Dodaj istniejące notatki">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </button>
      </header>
      <div id="folderNotesPane" class="list-pane"></div>
    </section>

    <!-- WYBÓR NOTATEK DO DODANIA -->
    <section id="folderPickerScreen" class="screen">
      <header class="topbar">
        <button id="pickerCloseBtn" class="icon-btn" aria-label="Zamknij">✕</button>
        <input id="pickerSearch" class="picker-search" placeholder="Szukaj notatek..." />
        <button id="pickerAddBtn" class="pill-add-btn" type="button">Dodaj</button>
      </header>
      <div id="pickerNotesPane" class="list-pane"></div>
    </section>

    <!-- MODAL: NOWY FOLDER -->
    <div id="folderModalBackdrop" class="backdrop hidden"></div>
    <div id="folderModal" class="folder-modal">
      <h3>Nowy folder</h3>
      <input id="folderNameInput" class="modal-input" placeholder="Nazwa folderu" />
      <div class="modal-actions">
        <button id="folderCancelBtn" class="btn-secondary" type="button">Anuluj</button>
        <button id="folderCreateBtn" type="button">Utwórz</button>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/service-worker.js');
    }
  </script>
</body>
</html>
